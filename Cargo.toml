[workspace.package]
name = "dictator"
version = "0.3.0"
authors = ["Artem Sergeev"]
edition = "2024"
publish = false

[workspace]
resolver = "2"
members = [
    "grpc_server",
    "silero_vad",
]

[workspace.dependencies]
silero_vad = { path = "silero_vad" }
log = "0.4.28"
hound = "3.5.1"
tonic = "0.14.2"
prost = "0.14.1"
config = "0.15.18"
anyhow = "1.0.100"
ndarray = "0.16.1"
thiserror = "2.0.17"
env_logger = "0.11.8"
lazy_static = "1.5.0"
serde_json = "1.0.145"
tonic-prost = "0.14.2"
tonic-prost-build = "0.14.2"
lockfree-object-pool = "0.1.6"
vosk = { version = "0.3.1", features = ["batch"] }
serde = { version = "1.0.228", features = ["derive"] }
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread"] }
ort = { version = "2.0.0-rc.9", features = ["load-dynamic", "coreml", "ndarray", "directml", "cuda"] }
parking_lot = { version = "0.12.3", features = ["hardware-lock-elision", "serde", "deadlock_detection", "arc_lock"] }
