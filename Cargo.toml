[workspace.package]
name = "dictator"
version = "0.3.0"
authors = ["Artem Sergeev <...>"]
edition = "2024"
publish = false

[workspace]
resolver = "2"
members = [
    "grpc_server",
    "silero_vad",
]

[workspace.dependencies]
silero_vad = { path = "silero_vad" }
log = "0.4.26"
hound = "3.5.1"
tonic = "0.12.3"
prost = "0.13.5"
config = "0.15.9"
anyhow = "1.0.97"
ndarray = "0.16.1"
lazy_static = "1.5.0"
thiserror = "2.0.12"
serde_json = "1.0.140"
lockfree-object-pool = "0.1.6"
tonic-build = { version = "0.12.3", features = [] }
vosk = { version = "0.3.1", features = ["batch"] }
serde = { version = "1.0.219", features = ["derive"] }
tokio = { version = "1.44.0", features = ["macros", "rt-multi-thread"] }
ort = { version = "=2.0.0-rc.9", features = ["load-dynamic", "coreml", "ndarray", "directml", "cuda"] }
parking_lot = { version = "0.12.3", features = ["hardware-lock-elision", "serde", "deadlock_detection", "arc_lock"] }
